trigger:
  - test/protection

variables:
  dockerRegistryServiceConnection: "ACR-Lang-App"
  azureSubscription: "Azure-Lang-App"
  appName: "azure-docker-demo-anna"

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Build
    displayName: Build and Push Docker Image

    jobs:
      - job: Build

        steps:
          - task: Docker@2
            displayName: Build and push Docker image
            inputs:
              command: buildAndPush
              repository: azure-docker-demo
              dockerfile: "$(Build.SourcesDirectory)/azure-docker-demo//Dockerfile"
              containerRegistry: "$(dockerRegistryServiceConnection)"
              tags: |
                $(Build.BuildId)

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: Deploy

        steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy Docker image to App Service
            inputs:
              azureSubscription: "$(azureSubscription)"
              appName: "$(appName)"
              containers: "langappregistry123.azurecr.io/azure-docker-demo:$(Build.BuildId)"
